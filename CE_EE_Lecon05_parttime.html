<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CE &amp; EE — Séance 05 · Technologie, famille et loisirs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,300;0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#3AABDC; --green:#5DB88A; --orange:#EE5818; --amber:#D4840A;
  --purple:#A18CD0; --dark:#2A2D35; --grey:#6E7E8A; --bg:#DDE4EC; --white:#FFFFFF; --acc:#22c55e;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito','Century Gothic',sans-serif;background:var(--bg);color:var(--dark);min-height:100vh;overflow-y:auto;-webkit-overflow-scrolling:touch;}

.app-header{background:var(--white);border-bottom:3px solid var(--green);padding:0 1.2rem;display:flex;align-items:center;justify-content:space-between;height:54px;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.07);position:sticky;top:0;z-index:100;}
.hdr-left{display:flex;align-items:center;gap:.8rem;}
.hdr-logo{height:30px;width:auto;}
.hdr-sep{width:1px;height:24px;background:#D0DDE8;}
.hdr-num{font-size:.58rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--grey);display:block;}
.hdr-title{font-size:.82rem;font-weight:700;color:var(--dark);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;}
.hdr-badge{font-size:.6rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:.2rem .65rem;border-radius:20px;background:var(--green);color:white;white-space:nowrap;}
.hdr-zoom-wrap{display:flex;align-items:center;gap:.5rem;position:absolute;left:50%;transform:translateX(-50%);}
.zoom-label{font-size:.65rem;font-weight:700;color:var(--grey);min-width:34px;text-align:right;}
.zoom-slider{-webkit-appearance:none;appearance:none;width:80px;height:4px;border-radius:2px;background:#D0DDE8;outline:none;cursor:pointer;}
.zoom-slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--green);cursor:pointer;}
.zoom-slider::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--green);cursor:pointer;border:none;}
.hdr-right{display:flex;align-items:center;gap:.7rem;}
.fs-btn{display:flex;align-items:center;gap:.35rem;background:#FFF;border:1.5px solid #C0D0DC;color:var(--grey);font-family:inherit;font-size:.66rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:.34rem .75rem;border-radius:20px;cursor:pointer;transition:all .18s;white-space:nowrap;}
.fs-btn:hover{border-color:var(--green);color:var(--green);background:#F1FBF5;}

.nav-bar{width:100%;max-width:920px;margin:0 auto;display:flex;align-items:center;gap:.8rem;padding:.55rem 1.5rem;background:var(--bg);border-bottom:1px solid #C8D8E4;position:sticky;top:54px;z-index:90;}
.nav-btn{display:flex;align-items:center;justify-content:center;background:var(--white);border:1.5px solid #C0D0DC;color:var(--grey);font-family:inherit;font-size:1rem;font-weight:700;width:36px;height:36px;border-radius:50%;cursor:pointer;transition:all .18s;box-shadow:0 1px 4px rgba(0,0,0,.06);flex-shrink:0;}
.nav-btn:hover:not(:disabled){border-color:var(--green);color:var(--green);background:#22c55e0d;}
.nav-btn:disabled{opacity:.3;cursor:not-allowed;}
.nav-btn.done{background:var(--green);color:white;border-color:var(--green);cursor:default;}
.prog-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:.2rem;}
.prog-track{width:100%;height:5px;background:#C8D8E4;border-radius:3px;overflow:hidden;}
.prog-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#22c55e,#5DB88A);transition:width .35s cubic-bezier(.4,0,.2,1);}
.prog-label{font-size:.65rem;font-weight:700;color:var(--grey);}
.size-ctrl{display:none;}

.stage{display:flex;flex-direction:column;align-items:center;padding:.8rem 1.2rem 2rem;}
.slide-scale-wrap{width:100%;max-width:920px;overflow:visible;}
.slide-wrap{width:100%;border-radius:16px;box-shadow:0 6px 28px rgba(0,0,0,.13);background:var(--white);transition:opacity .15s ease;overflow:visible;min-height:500px;}
.slide-wrap.fade{opacity:0;}

.cover-slide{position:relative;background:#FFF;border-top:6px solid var(--green);display:flex;flex-direction:column;min-height:480px;overflow:hidden;}
.cover-glow{position:absolute;top:-30%;left:50%;transform:translateX(-50%);width:700px;height:500px;background:radial-gradient(ellipse,#22c55e28 0%,transparent 70%);pointer-events:none;}
.cover-logo-wrap{padding:1.2rem 2rem .8rem;background:#F7FBF9;border-bottom:1px solid #E4EDF3;flex-shrink:0;}
.cover-logo{height:34px;}
.cover-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem 3rem;position:relative;}
.cover-badge{display:inline-block;padding:.28rem 1rem;border-radius:20px;font-size:.7rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase;border:1.5px solid transparent;margin-bottom:1rem;}
.cover-icon{font-size:3.3rem;line-height:1;margin-bottom:.7rem;}
.cover-title{font-size:clamp(1.4rem,3vw,2.1rem);font-weight:800;color:#1C2333;line-height:1.25;margin-bottom:.5rem;}
.cover-sub{font-size:.88rem;color:var(--grey);font-weight:400;margin-bottom:.4rem;}
.cover-plan{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;margin-top:1rem;}
.cover-plan-item{font-size:.72rem;font-weight:700;padding:.3rem .8rem;border-radius:20px;}
.cover-bar{height:4px;flex-shrink:0;background:linear-gradient(90deg,#22c55e,#5DB88A);}

.content-slide{display:flex;flex-direction:column;min-height:480px;}
.slide-hdr{display:flex;align-items:center;justify-content:space-between;padding:.65rem 1.4rem;flex-shrink:0;border-bottom:1px solid #EDF2F7;}
.slide-hdr-left{display:flex;align-items:center;gap:.75rem;}
.slide-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-size:.7rem;font-weight:800;flex-shrink:0;}
.slide-lnum{font-size:.58rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--grey);}
.slide-title{font-size:.93rem;font-weight:800;color:var(--dark);line-height:1.2;}
.type-pill{font-size:.62rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:.2rem .6rem;border-radius:20px;white-space:nowrap;flex-shrink:0;}
.slide-body{padding:1rem 1.5rem 1.5rem;display:flex;flex-direction:column;}

.sec-h3{font-size:.9rem;font-weight:800;margin:1rem 0 .4rem;padding-bottom:.3rem;border-bottom:2px solid currentColor;}
.sec-h3:first-child{margin-top:0;}
.body-p{font-size:.9rem;line-height:1.75;margin-bottom:.55rem;color:var(--dark);}
.body-p strong{font-weight:700;}
ul{list-style:none;padding:0;margin:.4rem 0;}
li{font-size:.88rem;line-height:1.7;padding:.32rem 0 .32rem 1.5rem;position:relative;border-bottom:1px solid #F0F4F8;}
li:last-child{border-bottom:none;}
li::before{content:'›';position:absolute;left:.3rem;color:var(--acc);font-size:1.1rem;font-weight:700;line-height:1.5;}
.em-item{font-size:.95rem;line-height:1.75;padding:.5rem 0;border-bottom:1px solid #F0F4F8;}
.tip{background:#EAF7F0;border-left:4px solid #5DB88A;border-radius:8px;padding:.55rem .9rem;font-size:.85rem;color:#2A5240;margin-top:.6rem;line-height:1.6;}
.tip.warn{background:#FEF6E6;border-left-color:#D4840A;color:#7a5610;}
.plan-list{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.6rem;}
.plan-chip{border-radius:20px;padding:.25rem .7rem;font-size:.8rem;font-weight:700;}
.cat-badge{display:inline-block;font-size:.6rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:#EEF4F9;color:#5D7A8A;border-radius:20px;padding:.15rem .6rem;margin-bottom:.5rem;}

.qcat-grid{display:flex;flex-direction:column;gap:.4rem;}
.q-item{display:flex;align-items:flex-start;gap:.6rem;padding:.55rem .9rem;background:var(--tint,#EAF7F0);border-radius:8px;border-left:4px solid var(--acc);line-height:1.55;}
.q-bullet{font-size:1rem;color:var(--acc);font-weight:800;flex-shrink:0;background:#fff;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--acc);}
.q-text{color:var(--dark);font-size:.88rem;}

.num-item{display:flex;gap:.6rem;align-items:flex-start;margin-bottom:.55rem;}
.num-dot{flex-shrink:0;width:24px;height:24px;border-radius:50%;color:#fff;font-weight:800;font-size:.78rem;display:flex;align-items:center;justify-content:center;background:var(--acc);}
.num-body{flex:1;font-size:.87rem;line-height:1.6;}
.num-body b{color:var(--acc);}

/* niveaux / bandes de points */
.band-list{display:flex;flex-direction:column;gap:.4rem;}
.band{display:flex;align-items:center;gap:.7rem;padding:.5rem .85rem;border-radius:9px;background:#F6F9FC;border-left:5px solid var(--bc,#3AABDC);}
.band-q{font-size:.72rem;font-weight:800;color:var(--bc,#3AABDC);min-width:74px;}
.band-lv{flex:1;font-size:.85rem;color:var(--dark);}
.band-pts{font-size:.72rem;font-weight:800;color:#fff;background:var(--bc,#3AABDC);border-radius:20px;padding:.18rem .6rem;white-space:nowrap;}

/* ===== CE INTERACTIF : texte + phrase clé + explication ===== */
.ce-legend{display:flex;align-items:center;gap:.5rem;font-size:.72rem;color:var(--grey);margin-bottom:.6rem;font-weight:600;}
.ce-legend .swatch{display:inline-block;width:16px;height:12px;border-radius:3px;background:#BBF3CF;}
.ce-text{background:#F6F8FA;border:1.5px solid #E2E9EF;border-radius:12px;padding:.9rem 1.1rem;font-size:.95rem;line-height:1.85;color:#1e2530;margin-bottom:.9rem;}
.ce-text .src-title{display:block;font-weight:800;font-style:italic;margin-bottom:.4rem;color:#2A2D35;}
.ce-mark{border-radius:4px;padding:0 .12rem;transition:background-color .45s ease,box-shadow .45s ease;}
.ce-q-wrap.revealed .ce-mark{background:#8CE3AD;box-shadow:0 0 0 1px #57cf8a;}
.ce-q-wrap.revealed .ce-mark.y{background:#FFE9A6;box-shadow:0 0 0 1px #f0c94a;}
.ce-question{font-size:.95rem;font-weight:800;color:#2A2D35;margin-bottom:.6rem;}
.ce-opts{display:flex;flex-direction:column;gap:.45rem;}
.ce-opt{text-align:left;font-family:inherit;font-size:.9rem;color:#2A2D35;background:#EEF2F6;border:2px solid transparent;border-radius:10px;padding:.6rem .9rem;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:.5rem;}
.ce-opt:hover{background:#E3EAF1;}
.ce-opt .tick{width:20px;height:20px;flex-shrink:0;border-radius:50%;border:2px solid #C0CDD8;display:inline-flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:800;color:transparent;}
.ce-opt.selected{border-color:#3AABDC;background:#E8F4FB;}
.ce-opt.selected .tick{border-color:#3AABDC;}
.ce-q-wrap.revealed .ce-opt{cursor:default;}
.ce-q-wrap.revealed .ce-opt.correct{background:#DCFCE7;border-color:#22c55e;color:#14532d;font-weight:700;}
.ce-q-wrap.revealed .ce-opt.correct .tick{background:#22c55e;border-color:#22c55e;color:#fff;}
.ce-q-wrap.revealed .ce-opt.wrong{background:#FDECEC;border-color:#EF4444;color:#7f1d1d;}
.ce-q-wrap.revealed .ce-opt.wrong .tick{background:#EF4444;border-color:#EF4444;color:#fff;}
.ce-actions{display:flex;gap:.6rem;margin-top:.8rem;align-items:center;flex-wrap:wrap;}
.ce-check{font-family:inherit;font-size:.82rem;font-weight:800;letter-spacing:.03em;color:#fff;background:#22c55e;border:none;border-radius:22px;padding:.5rem 1.3rem;cursor:pointer;transition:all .15s;box-shadow:0 2px 8px rgba(34,197,94,.28);}
.ce-check:hover{background:#1ba34d;}
.ce-check:disabled{opacity:.45;cursor:default;box-shadow:none;}
.ce-reset{font-family:inherit;font-size:.72rem;font-weight:700;color:var(--grey);background:none;border:1.5px solid #C8D8E4;border-radius:20px;padding:.4rem .9rem;cursor:pointer;display:none;}
.ce-q-wrap.revealed .ce-reset{display:inline-block;}
.ce-explain{display:none;margin-top:.9rem;background:#F1FAF4;border:1.5px solid #BBE9CC;border-left:5px solid #22c55e;border-radius:0 12px 12px 0;padding:.85rem 1.1rem;animation:ceIn .35s ease;}
.ce-q-wrap.revealed .ce-explain{display:block;}
@keyframes ceIn{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:none;}}
.ce-explain-h{font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#1E8A50;margin-bottom:.4rem;}
.ce-explain p{font-size:.88rem;line-height:1.7;color:#22432f;margin-bottom:.5rem;}
.ce-explain p:last-child{margin-bottom:0;}
.ce-link{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;font-size:.83rem;margin-top:.3rem;}
.ce-from{background:#DFF3E7;border:1px dashed #57cf8a;border-radius:6px;padding:.2rem .5rem;color:#166534;font-style:italic;}
.ce-arrow{color:#22c55e;font-weight:800;}
.ce-to{background:#E8F4FB;border:1px solid #7dd3fc;border-radius:6px;padding:.2rem .5rem;color:#075985;font-weight:700;}

/* zone d'écriture EE */
.notes-area{flex:1;min-height:120px;background:#FAFCFF;border:2px dashed #C8D8E4;border-radius:10px;padding:.9rem 1.1rem;font-family:inherit;font-size:.9rem;line-height:1.8;outline:none;cursor:text;color:var(--dark);}
.notes-area:focus{border-color:var(--acc);background:#fff;}
.write-placeholder{color:#B0C0CC;font-style:italic;pointer-events:none;}
.hi{background:#FFF3B0;border-radius:3px;padding:0 .15rem;}
.co{color:#3AABDC;font-weight:700;}

.struct-tbl{display:flex;flex-direction:column;gap:.35rem;margin-top:.3rem;}
.struct-row{display:flex;gap:.7rem;align-items:flex-start;padding:.5rem .8rem;border-radius:9px;background:#F6F9FC;}
.struct-step{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:#EE5818;color:#fff;font-size:.72rem;font-weight:800;display:flex;align-items:center;justify-content:center;}
.struct-l{flex:1;font-size:.85rem;line-height:1.5;}
.struct-l b{color:#EE5818;}
.struct-ex{color:var(--grey);font-style:italic;}

@media(max-width:600px){
  .stage{padding:.5rem .6rem 2rem;}
  .nav-bar{padding:.5rem .8rem;}
  .hdr-title{max-width:120px;font-size:.72rem;}
  .cover-body{padding:1.5rem 1.5rem;}
  .cover-title{font-size:1.3rem;}
  .slide-body{padding:.8rem 1rem 1.2rem;}
  .hdr-zoom-wrap{gap:.3rem;} .zoom-slider{width:60px;}
}

/* plein écran */
body.present .app-header{display:none;}
body.present .slide-wrap{max-width:none;border-radius:0;box-shadow:none;}
body.present .slide-scale-wrap{max-width:none;width:100%;}
body.present .nav-bar{position:fixed;left:50%;bottom:0;top:auto;transform:translateX(-50%);width:auto;max-width:none;margin:0;background:rgba(10,18,27,.78);backdrop-filter:blur(6px);border:none;border-radius:26px 26px 0 0;padding:.45rem 1.3rem;gap:1rem;z-index:120;opacity:.2;transition:opacity .25s;}
body.present .nav-bar:hover{opacity:1;}
body.present .prog-label{color:#FFF;}
body.present .prog-track{background:rgba(255,255,255,.25);}
body.present .nav-btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:#FFF;}
body.present{background:#0A121B;}
body.present .stage{padding:0;}
body.present .slide-wrap{display:flex;flex-direction:column;}
body.present .content-slide,body.present .cover-slide{flex:1;display:flex;flex-direction:column;min-height:0;}
body.present .slide-body{flex:1;}
body.present .kbd-hint{display:none;}
.fs-exit{display:none;}
body.present .fs-exit{display:block;position:fixed;top:12px;right:16px;z-index:120;font-size:.6rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.45);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:.24rem .7rem;cursor:pointer;}
.slide-body>*{flex-shrink:0;}
[contenteditable]{overflow-wrap:break-word;}

/* clavier d'accents */
.acc-bar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:200;display:none;align-items:center;justify-content:center;flex-wrap:wrap;gap:.26rem;max-width:min(94vw,880px);background:rgba(255,255,255,.97);border:1.5px solid #C8D8E4;box-shadow:0 8px 30px rgba(0,0,0,.2);border-radius:26px;padding:.45rem .8rem;}
.acc-bar.on{display:flex;}
body.present .acc-bar{bottom:78px;}
.acc-key{font-family:inherit;font-size:.9rem;font-weight:700;color:#2A2D35;background:#FFF;border:1.5px solid #C8D8E4;border-radius:7px;min-width:31px;height:31px;padding:0 .35rem;cursor:pointer;line-height:1;transition:all .12s;}
.acc-key:hover{border-color:#3AABDC;color:#3AABDC;background:#F6FBFE;}
.acc-key:active{transform:translateY(1px);}
.acc-sep{width:1px;height:19px;background:#D8E4EC;margin:0 .18rem;}
.acc-count{font-size:.7rem;font-weight:800;color:#6E7E8A;background:#EEF4F9;border-radius:20px;padding:.26rem .7rem;white-space:nowrap;margin-left:.35rem;}
.acc-count.ok{background:#E6F6EC;color:#33805A;}
.acc-count.under{background:#FEF6E6;color:#A9781A;}
.acc-count.over{background:#FDECEC;color:#C0392B;}

/* --- meilleure occupation verticale : centrer le contenu court --- */
.content-slide{min-height:470px;}
.content-slide .slide-body{flex:1;justify-content:center;}
.content-slide .slide-body.top{justify-content:flex-start;}
/* NCLC table */
.nclc{width:100%;border-collapse:collapse;font-size:.78rem;margin-top:.2rem;}
.nclc th,.nclc td{border:1px solid #E2E9EF;padding:.32rem .4rem;text-align:center;}
.nclc thead th{background:#F3EAF6;color:#7a2060;font-weight:800;font-size:.72rem;}
.nclc td.lv{font-weight:800;background:#FAFCFD;}
.nclc td.hot{background:#FDE1EC;box-shadow:inset 0 0 0 2px #E11D74;font-weight:800;color:#a1054c;}
.nclc caption{font-weight:800;color:#2A2D35;padding-bottom:.4rem;font-size:.82rem;}
.conn2{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;}
.conn-card{background:#FDF6F1;border:1px solid #F3D9C8;border-left:4px solid #EE5818;border-radius:10px;padding:.55rem .8rem;}
.conn-card h4{font-size:.8rem;color:#c2410c;margin-bottom:.35rem;font-weight:800;}
.conn-card p{font-size:.82rem;line-height:1.6;color:#2A2D35;margin:0;}
.conn-card .g{color:var(--grey);font-style:italic;}
@media(max-width:640px){.conn2{grid-template-columns:1fr}}
.pie-wrap{display:flex;align-items:center;gap:1.2rem;flex-wrap:wrap;justify-content:center;}
.donut{width:190px;height:190px;border-radius:50%;flex-shrink:0;background:conic-gradient(#A9C4DE 0 10.3%,#7FA8CC 10.3% 25.7%,#4E86BE 25.7% 48.8%,#2E68AC 48.8% 74.4%,#1E4C88 74.4% 89.7%,#12335F 89.7% 100%);box-shadow:0 4px 18px rgba(0,0,0,.12);}
.pie-leg{display:flex;flex-direction:column;gap:.28rem;font-size:.8rem;}
.pie-leg div{display:flex;align-items:center;gap:.5rem;}
.pie-sw{width:13px;height:13px;border-radius:3px;flex-shrink:0;}
.voc{background:#F6F9FC;border-radius:9px;padding:.5rem .8rem;margin-bottom:.4rem;}
.voc h4{font-size:.8rem;color:#3AABDC;font-weight:800;margin-bottom:.15rem;}
.voc p{font-size:.84rem;line-height:1.55;color:#2A2D35;margin:0;}
.mtab{width:100%;border-collapse:collapse;font-size:.83rem;}
.mtab td{border:1px solid #F3D9C8;padding:.42rem .6rem;vertical-align:top;}
.mtab td.k{background:#FDF1EA;font-weight:700;color:#c2410c;white-space:nowrap;width:34%;}
.mtab td.v{color:#2A2D35;line-height:1.5;}
.exbox{background:#FDF6F1;border:1.5px solid #EE581840;border-radius:12px;padding:.8rem 1rem;font-size:.88rem;line-height:1.75;}
/* niveaux : tableau compact */
.lvl-tbl{width:100%;border-collapse:collapse;font-size:.82rem;}
.lvl-tbl td{border:1px solid #EED9E6;padding:.4rem .55rem;vertical-align:top;}
.lvl-tbl td.n{background:#F3EAF6;font-weight:800;color:#7a2060;white-space:nowrap;width:24%;}
.lvl-tbl td.f{color:#2A2D35;line-height:1.45;}
.lvl-tbl td.f em{color:var(--grey);}

">↺ Réinitialiser</button></div><div class=\"ce-explain\"><div class=\"ce-explain-h\">💡 Explication</div><p>La bonne réponse <b>reformule</b> l'information clé du texte (surlignée). Les autres options reprennent souvent un mot du texte mais en changent le sens : ce sont les pièges.</p><div class=\"ce-link\"><span class=\"ce-from\">« Notre petite Mathilde a fait gratuitement de la natation et du cheval ! »</span><span class=\"ce-arrow\">→</span><span class=\"ce-to\">De pratiquer un sport</span></div></div><div class=\"ce-voc\"><div class=\"ce-voc-h\">📚 Vocabulaire du texte et des réponses</div><div class=\"voc-row\"><span class=\"m\">hébergement</span><span class=\"d\">le logement pour un séjour · accommodation</span></div><div class=\"voc-row\"><span class=\"m\">pratiquer</span><span class=\"d\">faire régulièrement · to practise</span></div><div class=\"voc-row\"><span class=\"m\">découvrir</span><span class=\"d\">trouver, explorer pour la première fois · to discover</span></div><div class=\"voc-row\"><span class=\"m\">organiser</span><span class=\"d\">préparer, mettre en place · to organize</span></div><div class=\"voc-row\"><span class=\"m\">spectacle</span><span class=\"d\">une représentation (théâtre…) · show</span></div><div class=\"voc-row\"><span class=\"m\">produit</span><span class=\"d\">un article vendu · product</span></div><div class=\"voc-row\"><span class=\"m\">région</span><span class=\"d\">une grande zone géographique · region</span></div><div class=\"voc-row\"><span class=\"m\">goûter</span><span class=\"d\">essayer un aliment · to taste</span></div></div></div></div>", "<div class=\"slide-hdr\" style=\"background:#EAF7F0;border-left:5px solid #22c55e\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#22c55e\">📖</span><div><div class=\"slide-lnum\">📖 CE · Q11-19</div><div class=\"slide-title\">Technologie et numérique</div></div></div><span class=\"type-pill\" style=\"background:#22c55e18;color:#22c55e;border:1.5px solid #22c55e40\">A2–B1</span></div><div class=\"slide-body\"><div class=\"serie-badge\">Q11-19 · texte informatif + déduction</div><div class=\"ce-legend\"><span class=\"swatch\"></span> Phrase clé = la phrase qui justifie la réponse · <span style=\"font-weight:700;color:#1E8A50\">📚 Vocabulaire</span> = mots clés expliqués en français</div><div class=\"ce-q-wrap\" data-answer=\"B\"><div class=\"ce-text\">En hiver et à l'extérieur, pour piloter n'importe quel appareil à écran tactile, il faut enlever ses gants, au risque d'attraper des engelures par les temps de grand froid. Plus de risque de se geler les mains désormais avec ce modèle de gants en chevreau doublé de soie. <span class=\"ce-mark\">Les perforations au niveau de l'index permettent un meilleur contact avec l'écran tactile</span>. On pourra être à la pointe de la technologie et de la mode. Mais être à la page a un prix, la paire de gants est plus chère que l'appareil à écran tactile : 370 euros.</div><div class=\"ce-question\">Quelle est la particularité de ces gants ?</div><div class=\"ce-opts\"><button class=\"ce-opt\" data-opt=\"A\"><span class=\"tick\"></span>A) Ils évitent de rayer les appareils à écran tactile</button><button class=\"ce-opt\" data-opt=\"B\"><span class=\"tick\"></span>B) Ils permettent un contact direct avec un écran tactile</button><button class=\"ce-opt\" data-opt=\"C\"><span class=\"tick\"></span>C) Ils sont équipés de capteurs reliés à un écran tactile</button><button class=\"ce-opt\" data-opt=\"D\"><span class=\"tick\"></span>D) Ils sont offerts lors de l'achat d'un écran tactile</button></div><div class=\"ce-actions\"><button class=\"ce-voc-btn\">📚 Vocabulaire</button><button class=\"ce-check\">Vérifier</button><button class=\"ce-reset\">↺ Réinitialiser</button></div><div class=\"ce-explain\"><div class=\"ce-explain-h\">💡 Explication</div><p>La bonne réponse <b>reformule</b> l'information clé du texte (surlignée). Les autres options reprennent souvent un mot du texte mais en changent le sens : ce sont les pièges.</p><div class=\"ce-link\"><span class=\"ce-from\">« Les perforations au niveau de l'index permettent un meilleur contact avec l'écran tactile »</span><span class=\"ce-arrow\">→</span><span class=\"ce-to\">Ils permettent un contact direct avec un écran tactile</span></div></div><div class=\"ce-voc\"><div class=\"ce-voc-h\">📚 Vocabulaire du texte et des réponses</div><div class=\"voc-row\"><span class=\"m\">technologie</span><span class=\"d\">les outils techniques modernes · technology</span></div><div class=\"voc-row\"><span class=\"m\">permettre</span><span class=\"d\">rendre possible · to allow</span></div><div class=\"voc-row\"><span class=\"m\">désormais</span><span class=\"d\">à partir de maintenant · from now on</span></div><div class=\"voc-row\"><span class=\"m\">appareil</span><span class=\"d\">un objet technique · device</span></div><div class=\"voc-row\"><span class=\"m\">doubler</span><span class=\"d\">multiplier par deux · to double</span></div><div class=\"voc-row\"><span class=\"m\">éviter</span><span class=\"d\">ne pas faire, échapper à · to avoid</span></div><div class=\"voc-row\"><span class=\"m\">écran</span><span class=\"d\">la surface d'affichage · screen</span></div><div class=\"voc-row\"><span class=\"m\">achat</span><span class=\"d\">ce qu'on achète · purchase</span></div></div></div></div>", "<div class=\"slide-hdr\" style=\"background:#EAF7F0;border-left:5px solid #22c55e\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#22c55e\">📖</span><div><div class=\"slide-lnum\">📖 CE · Q11-19</div><div class=\"slide-title\">Famille</div></div></div><span class=\"type-pill\" style=\"background:#22c55e18;color:#22c55e;border:1.5px solid #22c55e40\">A2–B1</span></div><div class=\"slide-body\"><div class=\"serie-badge\">Q11-19 · texte informatif + déduction</div><div class=\"ce-legend\"><span class=\"swatch\"></span> Phrase clé = la phrase qui justifie la réponse · <span style=\"font-weight:700;color:#1E8A50\">📚 Vocabulaire</span> = mots clés expliqués en français</div><div class=\"ce-q-wrap\" data-answer=\"A\"><div class=\"ce-text\">COMMENT APPRENDRE UNE LANGUE ETRANGERE<br><br>Existe-t-il un âge critique au-delà duquel on ne peut plus jamais atteindre le niveau d'un locuteur natif ? Ce sujet fait l'objet de nombreux débats. <span class=\"ce-mark\">Plus on est jeune, plus on a d'appétit pour découvrir le monde.</span> L'apprentissage d'une langue quelle qu'elle soit, est donc plus simple mais il y a également une composante sociale. On se comporte avec l'enfant d'une manière bien particulière, que l'on ne peut reproduire avec un adolescent ou un adulte.</div><div class=\"ce-question\">D'après cet extrait, qu'est-ce qui favorise chez les enfants l'apprentissage d'une langue étrangère ?</div><div class=\"ce-opts\"><button class=\"ce-opt\" data-opt=\"A\"><span class=\"tick\"></span>A) Leur curiosité</button><button class=\"ce-opt\" data-opt=\"B\"><span class=\"tick\"></span>B) Leur imagination</button><button class=\"ce-opt\" data-opt=\"C\"><span class=\"tick\"></span>C) Leur mémoire</button><button class=\"ce-opt\" data-opt=\"D\"><span class=\"tick\"></span>D) Leur obéissance</button></div><div class=\"ce-actions\"><button class=\"ce-voc-btn\">📚 Vocabulaire</button><button class=\"ce-check\">Vérifier</button><button class=\"ce-reset\">↺ Réinitialiser</button></div><div class=\"ce-explain\"><div class=\"ce-explain-h\">💡 Explication</div><p>La bonne réponse <b>reformule</b> l'information clé du texte (surlignée). Les autres options reprennent souvent un mot du texte mais en changent le sens : ce sont les pièges.</p><div class=\"ce-link\"><span class=\"ce-from\">« Plus on est jeune, plus on a d'appétit pour découvrir le monde. »</span><span class=\"ce-arrow\">→</span><span class=\"ce-to\">Leur curiosité</span></div></div><div class=\"ce-voc\"><div class=\"ce-voc-h\">📚 Vocabulaire du texte et des réponses</div><div class=\"voc-row\"><span class=\"m\">apprentissage</span><span class=\"d\">le fait d'apprendre · learning</span></div><div class=\"voc-row\"><span class=\"m\">imagination</span><span class=\"d\">la capacité d'inventer · imagination</span></div><div class=\"voc-row\"><span class=\"m\">reproduire</span><span class=\"d\">refaire, copier · to reproduce</span></div><div class=\"voc-row\"><span class=\"m\">curiosité</span><span class=\"d\">l'envie de découvrir · curiosity</span></div><div class=\"voc-row\"><span class=\"m\">apprendre</span><span class=\"d\">acquérir une connaissance · to learn</span></div><div class=\"voc-row\"><span class=\"m\">atteindre</span><span class=\"d\">arriver à (un but) · to reach</span></div><div class=\"voc-row\"><span class=\"m\">également</span><span class=\"d\">aussi · also</span></div><div class=\"voc-row\"><span class=\"m\">locuteur</span><span class=\"d\">celui qui parle une langue · speaker</span></div></div></div></div>", "<div class=\"slide-hdr\" style=\"background:#EAF7F0;border-left:5px solid #22c55e\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#22c55e\">📖</span><div><div class=\"slide-lnum\">📖 CE · Q11-19</div><div class=\"slide-title\">Voyages et loisirs</div></div></div><span class=\"type-pill\" style=\"background:#22c55e18;color:#22c55e;border:1.5px solid #22c55e40\">A2–B1</span></div><div class=\"slide-body\"><div class=\"serie-badge\">Q11-19 · texte informatif + déduction</div><div class=\"ce-legend\"><span class=\"swatch\"></span> Phrase clé = la phrase qui justifie la réponse · <span style=\"font-weight:700;color:#1E8A50\">📚 Vocabulaire</span> = mots clés expliqués en français</div><div class=\"ce-q-wrap\" data-answer=\"C\"><div class=\"ce-text\">Les repas servis dans les avions de ligne ont toujours été tristement réputés pour leur fadeur. Mais il semblerait que les chefs n'y soient pour rien. D'après une étude, <span class=\"ce-mark\">les nuisances sonores importantes peuvent en effet réduire la sensibilité des palais</span>, rendant la nourriture peu savoureuse. Le vrombissement des réacteurs expliquerait le peu d'enthousiasme des passagers pour les plateaux servis à bord. Les chercheurs ont aussi découvert que des sons agréables pouvaient faire mieux apprécier les mets.</div><div class=\"ce-question\">Quelle est la conclusion de cette étude ?</div><div class=\"ce-opts\"><button class=\"ce-opt\" data-opt=\"A\"><span class=\"tick\"></span>A) L'anxiété en avion diminue la sensation de faim</button><button class=\"ce-opt\" data-opt=\"B\"><span class=\"tick\"></span>B) La qualité de la nourriture se détériore en altitude</button><button class=\"ce-opt\" data-opt=\"C\"><span class=\"tick\"></span>C) Le bruit altère le sens du goût des passagers</button><button class=\"ce-opt\" data-opt=\"D\"><span class=\"tick\"></span>D) Les plats proposés en vol manquent de saveur</button></div><div class=\"ce-actions\"><button class=\"ce-voc-btn\">📚 Vocabulaire</button><button class=\"ce-check\">Vérifier</button><button class=\"ce-reset\">↺ Réinitialiser</button></div><div class=\"ce-explain\"><div class=\"ce-explain-h\">💡 Explication</div><p>La bonne réponse <b>reformule</b> l'information clé du texte (surlignée). Les autres options reprennent souvent un mot du texte mais en changent le sens : ce sont les pièges.</p><div class=\"ce-link\"><span class=\"ce-from\">« les nuisances sonores importantes peuvent en effet réduire la sensibilité des palais »</span><span class=\"ce-arrow\">→</span><span class=\"ce-to\">Le bruit altère le sens du goût des passagers</span></div></div><div class=\"ce-voc\"><div class=\"ce-voc-h\">📚 Vocabulaire du texte et des réponses</div><div class=\"voc-row\"><span class=\"m\">nourriture</span><span class=\"d\">ce qu'on mange · food</span></div><div class=\"voc-row\"><span class=\"m\">savoureux</span><span class=\"d\">qui a bon goût · tasty</span></div><div class=\"voc-row\"><span class=\"m\">nuisance</span><span class=\"d\">gêne (bruit, odeur…) · nuisance</span></div><div class=\"voc-row\"><span class=\"m\">diminuer</span><span class=\"d\">devenir/rendre plus petit · to decrease</span></div><div class=\"voc-row\"><span class=\"m\">altitude</span><span class=\"d\">la hauteur au-dessus de la mer · altitude</span></div><div class=\"voc-row\"><span class=\"m\">proposer</span><span class=\"d\">suggérer, offrir · to offer/suggest</span></div><div class=\"voc-row\"><span class=\"m\">réduire</span><span class=\"d\">diminuer · to reduce</span></div><div class=\"voc-row\"><span class=\"m\">anxiété</span><span class=\"d\">une forte inquiétude · anxiety</span></div></div></div></div>", "<div class=\"slide-hdr\" style=\"background:#EAF7F0;border-left:5px solid #22c55e\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#22c55e\">📖</span><div><div class=\"slide-lnum\">📖 CE · Q11-19</div><div class=\"slide-title\">Technologie et numérique</div></div></div><span class=\"type-pill\" style=\"background:#22c55e18;color:#22c55e;border:1.5px solid #22c55e40\">A2–B1</span></div><div class=\"slide-body\"><div class=\"serie-badge\">Q11-19 · texte informatif + déduction</div><div class=\"ce-legend\"><span class=\"swatch\"></span> Phrase clé = la phrase qui justifie la réponse · <span style=\"font-weight:700;color:#1E8A50\">📚 Vocabulaire</span> = mots clés expliqués en français</div><div class=\"ce-q-wrap\" data-answer=\"B\"><div class=\"ce-text\">La télévision, les jeux vidéo, les ordinateurs ont envahi les foyers. Alors, certains parents craignent le risque d'addiction pour leurs enfants. Quel est le quota d'heures quotidien devant les écrans à ne pas dépasser ? Pour les psychologues, le critère à prendre en compte est celui de l'exclusivité. Si les jeux vidéo et Internet sont l'unique source de relation et de distraction pour un adolescent, alors, il faut s'inquiéter et agir. Réguler la consommation d'images, c'est le travail des parents qui doivent <span class=\"ce-mark\">faire des écrans des objets d'échange familial et non un refuge individuel</span iv class=\"ce-explain\"><div class=\"ce-explain-h\">💡 Explication</div><p>La bonne réponse <b>reformule</b> l'information clé du texte (surlignée). Les autres options reprennent souvent un mot du texte mais en changent le sens : ce sont les pièges.</p><div class=\"ce-link\"><span class=\"ce-from\">« Que vos projets immobiliers voient enfin le jour avec cette année qui débute ! »</span><span class=\"ce-arrow\">→</span><span class=\"ce-to\">Envoyer des vœux de nouvel an</span></div></div><div class=\"ce-voc\"><div class=\"ce-voc-h\">📚 Vocabulaire du texte et des réponses</div><div class=\"voc-row\"><span class=\"m\">déménager</span><span class=\"d\">changer de logement · to move house</span></div><div class=\"voc-row\"><span class=\"m\">réussite</span><span class=\"d\">le succès · success</span></div><div class=\"voc-row\"><span class=\"m\">envoyer</span><span class=\"d\">faire parvenir · to send</span></div><div class=\"voc-row\"><span class=\"m\">bonheur</span><span class=\"d\">l'état d'être heureux · happiness</span></div><div class=\"voc-row\"><span class=\"m\">voyager</span><span class=\"d\">se déplacer, aller loin · to travel</span></div><div class=\"voc-row\"><span class=\"m\">séjour</span><span class=\"d\">temps passé quelque part · stay</span></div><div class=\"voc-row\"><span class=\"m\">organiser</span><span class=\"d\">préparer, mettre en place · to organize</span></div><div class=\"voc-row\"><span class=\"m\">achat</span><span class=\"d\">ce qu'on achète · purchase</span></div></div></div></div>", "<div class=\"slide-hdr\" style=\"background:#EAF7F0;border-left:5px solid #22c55e\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#22c55e\">📖</span><div><div class=\"slide-lnum\">📖 CE · Q20-29</div><div class=\"slide-title\">Technologie et numérique</div></div></div><span class=\"type-pill\" style=\"background:#22c55e18;color:#22c55e;border:1.5px solid #22c55e40\">B1–B2</span></div><div class=\"slide-body\"><div class=\"serie-badge\">Q20-29 · texte long + inférence</div><div class=\"ce-legend\"><span class=\"swatch\"></span> Phrase clé = la phrase qui justifie la réponse · <span style=\"font-weight:700;color:#1E8A50\">📚 Vocabulaire</span> = mots clés expliqués en français</div><div class=\"ce-q-wrap\" data-answer=\"D\"><div class=\"ce-text\">Le droit à l'oubli sur Internet est fondamental. Aujourd'hui, Internet nous expose à des risques, en mettant à portée d'institutions ou d'entreprises des informations personnelles que nous avons oubliées ou que nous souhaitons oublier. Or l'oubli, autant que la mémoire, est essentiel à l'humain pour être capable d'agir et de fonctionner dans le présent. Un spécialiste de la question propose une solution. Si les gens ont envie de sauvegarder des informations les concernant, ils y attacheront une date d'expiration. <span class=\"ce-mark\">Les citoyens doivent choisir eux-mêmes ce qui, de leurs informations personnelles, sera retenu ou effacé.</span> Cela ne doit pas résulter du choix de grosses sociétés ou de gouvernements.</div><div class=\"ce-question\">Pourquoi le droit à l'oubli sur Internet est-il important ?</div><div class=\"ce-opts\"><button class=\"ce-opt\" data-opt=\"A\"><span class=\"tick\"></span>A) Pour aider à faire le deuil du passé</button><button class=\"ce-opt\" data-opt=\"B\"><span class=\"tick\"></span>B) Pour alléger le stockage des données</button><button class=\"ce-opt\" data-opt=\"C\"><span class=\"tick\"></span>C) Pour faire obstacle aux multinationales</button><button class=\"ce-opt\" data-opt=\"D\"><span class=\"tick\"></span>D) Pour rester maître de sa vie privée</button></div><div class=\"ce-actions\"><button class=\"ce-voc-btn\">📚 Vocabulaire</button><button class=\"ce-check\">Vérifier</button><button class=\"ce-reset\">↺ Réinitialiser</button></div><div class=\"ce-explain\"><div class=\"ce-explain-h\">💡 Explication</div><p>La bonne réponse <b>reformule</b> l'information clé du texte (surlignée). Les autres options reprennent souvent un mot du texte mais en changent le sens : ce sont les pièges.</p><div class=\"ce-link\"><span class=\"ce-from\">« Les citoyens doivent choisir eux-mêmes ce qui, de leurs informations personnelles, sera retenu ou effacé. »</span><span class=\"ce-arrow\">→</span><span class=\"ce-to\">Pour rester maître de sa vie privée</span></div></div><div class=\"ce-voc\"><div class=\"ce-voc-h\">📚 Vocabulaire du texte et des réponses</div><div class=\"voc-row\"><span class=\"m\">fondamental</span><span class=\"d\">de base, primordial · fundamental</span></div><div class=\"voc-row\"><span class=\"m\">entreprise</span><span class=\"d\">une société, une compagnie · company</span></div><div class=\"voc-row\"><span class=\"m\">essentiel</span><span class=\"d\">très important, indispensable · essential</span></div><div class=\"voc-row\"><span class=\"m\">choisir</span><span class=\"d\">faire un choix · to choose</span></div><div class=\"voc-row\"><span class=\"m\">citoyen</span><span class=\"d\">membre d'une société · citizen</span></div><div class=\"voc-row\"><span class=\"m\">mémoire</span><span class=\"d\">la capacité à se souvenir · memory</span></div><div class=\"voc-row\"><span class=\"m\">alléger</span><span class=\"d\">rendre moins lourd · to lighten</span></div><div class=\"voc-row\"><span class=\"m\">donnée</span><span class=\"d\">une information chiffrée · data</span></div></div></div></div>", "<div class=\"slide-hdr\" style=\"background:#FDECE4;border-left:5px solid #EE5818\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#EE5818\">✍️</span><div><div class=\"slide-lnum\">✍️ EE · Structure</div><div class=\"slide-title\">Tâche 2 — la même structure pour tous les récits</div></div></div><span class=\"type-pill\" style=\"background:#EE581818;color:#EE5818;border:1.5px solid #EE581840\">À mémoriser</span></div><div class=\"slide-body top\"><table class=\"mtab\"><tr><td class=\"k\">① Introduction</td><td class=\"v\">de quoi il s'agit, quand, dans quel but<br><span style=\"color:#6E7E8A;font-size:.82rem\"><i>Il y a quelques années, j'ai décidé de…</i></span></td></tr><tr><td class=\"k\">② Développement</td><td class=\"v\">un exemple précis au passé (PC + imparfait)<br><span style=\"color:#6E7E8A;font-size:.82rem\"><i>Au début, c'était difficile, mais ensuite…</i></span></td></tr><tr><td class=\"k\">③ Bilan</td><td class=\"v\">ce qu'on a appris / ressenti<br><span style=\"color:#6E7E8A;font-size:.82rem\"><i>Grâce à cette expérience, j'ai compris que…</i></span></td></tr><tr><td class=\"k\">④ Conclusion</td><td class=\"v\">recommandation ou ouverture<br><span style=\"color:#6E7E8A;font-size:.82rem\"><i>Je conseille à tout le monde de… C'était inoubliable.</i></span></td></tr></table><div class=\"tip\">🔁 <b>On ne change jamais la structure</b> — seul le thème change. Vous la remplissez avec <b>votre propre contenu</b>.</div></div>", "<div class=\"slide-hdr\" style=\"background:#FDECE4;border-left:5px solid #EE5818\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#EE5818\">⏱️</span><div><div class=\"slide-lnum\">⏱️ EE · Les temps</div><div class=\"slide-title\">Quel temps pour quel usage ?</div></div></div><span class=\"type-pill\" style=\"background:#EE581818;color:#EE5818;border:1.5px solid #EE581840\">Grammaire</span></div><div class=\"slide-body top\"><table class=\"mtab\"><tr><td class=\"k\">L'action, l'événement (ce qui s'est passé)</td><td class=\"v\"><b>Passé composé</b><br><span style=\"color:#6E7E8A;font-size:.82rem\">J'<b>ai déménagé</b> ; nous <b>avons visité</b> ; elle <b>est arrivée</b>.</span></td></tr><tr><td class=\"k\">Le décor, l'habitude, l'émotion (arrière-plan)</td><td class=\"v\"><b>Imparfait</b><br><span style=\"color:#6E7E8A;font-size:.82rem\">Il <b>faisait</b> froid ; je <b>ne connaissais</b> personne ; nous <b>étions</b> heureux.</span></td></tr><tr><td class=\"k\">Un fait antérieur (plus tôt encore)</td><td class=\"v\"><b>Plus-que-parfait ⭐</b><br><span style=\"color:#6E7E8A;font-size:.82rem\">J'<b>avais déjà essayé</b> avant, mais cette fois-ci, tout a changé.</span></td></tr><tr><td class=\"k\">Le bilan, l'avis d'aujourd'hui</td><td class=\"v\"><b>Présent</b><br><span style=\"color:#6E7E8A;font-size:.82rem\">Aujourd'hui, je <b>pense</b> que… ; je <b>conseille</b> de… ; je <b>garde</b> un beau souvenir.</span></td></tr></table><div class=\"tip\">👉 Le duo gagnant du récit : <b>passé composé</b> (les actions) + <b>imparfait</b> (le décor). Le ⭐ plus-que-parfait fait la différence au NCLC 7.</div></div>", "<div class=\"slide-hdr\" style=\"background:#FDECE4;border-left:5px solid #EE5818\"><div class=\"slide-hdr-left\"><span class=\"slide-dot\" style=\"background:#EE5818\">🧭</span><div><div class=\"slide-lnum\">🧭 EE · Trouver une idée</div><div class=\"slide-title\">Un récit, plein d'angles possibles</div></div></div><span class=\"type-pill\" style=\"background:#EE581818;color:#EE5818;border:1.5px solid #EE581840\">Tâche 2</span></div><div class=\"slide-body top\"><p class=\"body-p\" style=\"margin-bottom:.4rem\">On écrit souvent la même chose (un plat, une personne, un paysage). Pour surprendre le correcteur, choisissez plutôt un <b>angle</b> :</p><div class=\"struct-tbl\"><div class=\"struct-row\"><span class=\"struct-step\" style=\"background:#EE5818\">◆</span><div class=\"struct-l\"><b>🔄 Un changement d'habitude</b> — arrêter ou adopter une habitude</div></div><div class=\"struct-row\"><span class=\"struct-step\" style=\"background:#EE5818\">◆</span><div class=\"struct-l\"><b>🔀 Un imprévu heureux</b> — un projet qui a mal tourné… puis bien fini</div></div><div class=\"struct-row\"><span class=\"struct-step\" style=\"background:#EE5818\">◆</span><div class=\"struct-l\"><b>👨‍👩‍👧 Une tradition</b> — un rituel de famille et ce qu'il représente</div></div></div><div class=\"tip\">💡 Prenez <b>UN</b> angle et racontez <b>UN</b> exemple précis. Un petit moment bien raconté vaut mieux qu'un grand résumé.</div></div>", "<div c e:.9rem\">finalement</span></div><div style=\"font-weight:800;color:#9B3210;font-size:.8rem;margin:.35rem 0 .1rem\">⭐ Pour viser le NCLC 7</div><div style=\"line-height:2\"><span style=\"display:inline-block;margin:.18rem;padding:.3rem .6rem;background:#FFE9DC;border:1.5px solid #EE581855;border-radius:20px;font-weight:600;color:#9B3210;font-size:.9rem\">⭐ un vrai gain de temps</span><span style=\"display:inline-block;margin:.18rem;padding:.3rem .6rem;background:#FFE9DC;border:1.5px solid #EE581855;border-radius:20px;font-weight:600;color:#9B3210;font-size:.9rem\">⭐ à double tranchant</span><span style=\"display:inline-block;margin:.18rem;padding:.3rem .6rem;background:#FFE9DC;border:1.5px solid #EE581855;border-radius:20px;font-weight:600;color:#9B3210;font-size:.9rem\">⭐ non sans surprise</span><span style=\"display:inline-block;margin:.18rem;padding:.3rem .6rem;background:#FFE9DC;border:1.5px solid #EE581855;border-radius:20px;font-weight:600;color:#9B3210;font-size:.9rem\">⭐ force est de constater</span></div></div><div class=\"notes-area\" contenteditable=\"true\" spellcheck=\"false\" data-min=\"120\" data-max=\"150\"><span class=\"write-placeholder\">Rédigez votre texte ici… (clavier d'accents et compteur en bas)</span></div></div>"];
const N=S.length;
let cur=0;

function clearPH(el){
  el.addEventListener('focus',()=>{const p=el.querySelector('.write-placeholder');if(p)p.style.display='none';});
  el.addEventListener('blur',()=>{const p=el.querySelector('.write-placeholder');if(p&&el.innerText.trim()==='')p.style.display='';});
}

/* ---- CE interactif ---- */
function initCE(root){
  root.querySelectorAll('.ce-q-wrap').forEach(w=>{
    let sel=null;
    const opts=w.querySelectorAll('.ce-opt');
    const check=w.querySelector('.ce-check');
    const reset=w.querySelector('.ce-reset');
    const ans=w.dataset.answer;
    opts.forEach(o=>o.addEventListener('click',()=>{
      if(w.classList.contains('revealed'))return;
      opts.forEach(x=>x.classList.remove('selected'));
      o.classList.add('selected');o.querySelector('.tick').textContent='●';
      opts.forEach(x=>{if(x!==o)x.querySelector('.tick').textContent='';});
      sel=o.dataset.opt;
    }));
    check&&check.addEventListener('click',()=>{
      if(!sel)return;
      w.classList.add('revealed');
      opts.forEach(o=>{
        const t=o.querySelector('.tick');
        if(o.dataset.opt===ans){o.classList.add('correct');t.textContent='✓';}
        else if(o.dataset.opt===sel){o.classList.add('wrong');t.textContent='✗';}
        else t.textContent='';
      });
      check.disabled=true;
    });
    reset&&reset.addEventListener('click',()=>{
      w.classList.remove('revealed');sel=null;check.disabled=false;
      opts.forEach(o=>{o.classList.remove('selected','correct','wrong');o.querySelector('.tick').textContent='';});
    });
    const vbtn=w.querySelector('.ce-voc-btn');
    vbtn&&vbtn.addEventListener('click',()=>{w.classList.toggle('voc-open');vbtn.textContent=w.classList.contains('voc-open')?'📚 Masquer le vocabulaire':'📚 Vocabulaire';});
    w.querySelectorAll('.vw').forEach(x=>x.addEventListener('click',()=>{
      w.classList.add('voc-open');if(vbtn)vbtn.textContent='📚 Masquer le vocabulaire';
      const k=x.dataset.k;if(k){const row=w.querySelector('.voc-row[data-k="'+k+'"]');if(row){row.classList.add('flash');setTimeout(()=>row.classList.remove('flash'),900);}}
    }));
  });
}

function render(idx,smooth){
  cur=idx;
  const sw=document.getElementById('sw');
  sw.classList.add('fade');
  setTimeout(()=>{
    sw.innerHTML=S[cur];
    sw.querySelectorAll('img.brand').forEach(i=>i.src=LOGO);
    sw.querySelectorAll('[contenteditable]').forEach(clearPH);
    initCE(sw);
    layout();sw.classList.remove('fade');
    document.getElementById('pf').style.width=((cur+1)/N*100)+'%';
    document.getElementById('pl').textContent=(cur+1)+' / '+N;
    document.getElementById('bp').disabled=cur===0;
    const bn=document.getElementById('bn');
    if(cur===N-1){bn.className='nav-btn done';bn.textContent='✓';bn.disabled=true;}
    else{bn.className='nav-btn';bn.textContent='→';bn.disabled=false;bn.style.background='#22c55e';bn.style.borderColor='#22c55e';bn.style.color='#fff';}
    layout();
    if(smooth!==false)window.scrollTo({top:0,behavior:inPresent()?'auto':'smooth'});
  },130);
}
function go(d){const n=cur+d;if(n>=0&&n<N)render(n);}

/* ===== sommaire / saut de page ===== */
const SLIDE_INDEX=(function(){
  const d=document.createElement('div');
  return S.map(function(h,i){
    d.innerHTML=h;
    const t=d.querySelector('.slide-title')||d.querySelector('.cover-title');
    const k=d.querySelector('.slide-lnum');
    return {t:(t?t.textContent:'Page '+(i+1)).trim(),k:(k?k.textContent:'').trim()};
  });
})();
const esc=function(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;');};
const jumpBack=document.createElement('div');jumpBack.className='jump-back';
const jumpPanel=document.createElement('div');jumpPanel.className='jump-panel';
jumpPanel.innerHTML='<div class="jump-hd"><span>\u{1F4D1} Aller \u00e0 la page</span>'
 +'<input class="jump-in" id="jumpIn" type="number" min="1" max="'+N+'" placeholder="n\u00b0">'
 +'<button class="jump-close" title="Fermer (\u00c9chap)">\u2715</button></div>'
 +'<div class="jump-list" id="jumpList"></div>';
document.body.appendChild(jumpBack);document.body.appendChild(jumpPanel);
document.getElementById('jumpList').innerHTML=SLIDE_INDEX.map(function(o,i){
  return '<button class="jump-item" data-i="'+i+'"><span class="jump-n">'+(i+1)+'</span>'
   +'<span class="jump-t">'+esc(o.t)+(o.k?'<em>'+esc(o.k)+'</em>':'')+'</span></button>';
}).join('');
function markJump(){jumpPanel.querySelectorAll('.jump-item').forEach(function(b){b.classList.toggle('on',+b.dataset.i===cur);});}
function openJump(){jumpBack.classList.add('on');jumpPanel.classList.add('on');markJump();
  const a=jumpPanel.querySelector('.jump-item.on');if(a&&a.scrollIntoView)a.scrollIntoView({block:'center'});
  const inp=document.getElementById('jumpIn');inp.value='';setTimeout(function(){inp.focus();},60);}
function closeJump(){jumpBack.classList.remove('on');jumpPanel.classList.remove('on');}
function goTo(i){if(i>=0&&i<N&&i!==cur)render(i);closeJump();}
document.getElementById('jumpList').addEventListener('click',function(e){
  const b=e.target.closest('.jump-item');if(b)goTo(+b.dataset.i);});
jumpPanel.querySelector('.jump-close').onclick=closeJump;
jumpBack.onclick=closeJump;
document.getElementById('jumpIn').addEventListener('keydown',function(e){
  e.stopPropagation();
  if(e.key==='Enter'){e.preventDefault();const v=parseInt(e.target.value,10);if(v>=1&&v<=N)goTo(v-1);}
  if(e.key==='Escape'){e.preventDefault();closeJump();}});
(function(){
  const pl=document.getElementById('pl');
  pl.title='Cliquer pour choisir une page (G)';
  pl.addEventListener('click',openJump);
  const tr=document.querySelector('.prog-track');
  tr.title='Cliquer pour se d\u00e9placer';
  tr.addEventListener('click',function(e){
    const r=tr.getBoundingClientRect();
    goTo(Math.min(N-1,Math.max(0,Math.round((e.clientX-r.left)/r.width*(N-1)))));});
})();
document.addEventListener('keydown',function(e){
  if(e.target.isContentEditable||e.target.tagName==='INPUT')return;
  if(e.key==='Escape'&&jumpPanel.classList.contains('on')){e.stopPropagation();closeJump();return;}
  if(e.key==='g'||e.key==='G'){e.preventDefault();openJump();}
  if(e.key==='Home'){e.preventDefault();goTo(0);}
  if(e.key==='End'){e.preventDefault();goTo(N-1);}
},true);


document.addEventListener('keydown',e=>{
  if(['ArrowRight',' '].includes(e.key)&&!e.target.isContentEditable&&e.target.tagName!=='INPUT'&&e.target.tagName!=='BUTTON'){e.preventDefault();go(1);}
  if(e.key==='ArrowLeft'&&!e.target.isContentEditable&&e.target.tagName!=='INPUT'){e.preventDefault();go(-1);}
});
let tx=0;
document.addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>55&&!document.activeElement.isContentEditable&&document.activeElement.tagName!=='BUTTON')go(dx<0?1:-1);
},{passive:true});

const zr=document.getElementById('zr'),zl_el=document.getElementById('zl'),sw_el=document.getElementById('sw');
function applyZoom(v){zl_el.textContent=v+'%';const s=v/100;sw_el.style.transform='scale('+s+')';sw_el.style.width=Math.round(920*(1/s))+'px';sw_el.style.transformOrigin='top center';}
zr.addEventListener('input',()=>applyZoom(parseInt(zr.value)));

/* plein écran */
const SW=document.getElementById('sw'),SSW=document.getElementById('ssw'),DESIGN_W=1120;
window.pz=1;
function inPresent(){return document.body.classList.contains('present');}
function fsElement(){return document.fullscreenElement||document.webkitFullscreenElement;}
function restoreNormal(){SW.style.width='';SW.style.height='';SW.style.minHeight='';SW.style.maxWidth='';SW.style.transform='';SW.style.transformOrigin='top center';SW.style.margin='';if(SSW){SSW.style.height='';SSW.style.width='';SSW.style.maxWidth='';SSW.style.overflow='';}if(zr)zr.dispatchEvent(new Event('input'));}
function layout(){
  if(!inPresent()){restoreNormal();return;}
  const s=Math.min(window.innerWidth/DESIGN_W,2.4)*(window.pz||1);
  const w=window.innerWidth/s;
  SW.style.maxWidth='none';SW.style.transformOrigin='top center';SW.style.margin='0 auto';SW.style.width=w+'px';SW.style.transform='scale('+s+')';SW.style.minHeight=((window.innerHeight/s)-4)+'px';
}
function toggleFS(){
  const el=document.documentElement;
  if(!fsElement()){(el.requestFullscreen||el.webkitRequestFullscreen).call(el).catch(()=>{document.body.classList.toggle('present');layout();});}
  else{(document.exitFullscreen||document.webkitExitFullscreen).call(document);}
}
function onFsChange(){document.body.classList.toggle('present',!!fsElement());const b=document.getElementById('fsb');if(b)b.querySelector('.fs-txt').textContent=fsElement()?'Quitter':'Plein écran';setTimeout(layout,120);setTimeout(layout,450);}
document.addEventListener('fullscreenchange',onFsChange);
document.addEventListener('webkitfullscreenchange',onFsChange);
window.addEventListener('resize',()=>layout());
document.addEventListener('keydown',e=>{
  if(e.target.isContentEditable||e.target.tagName==='INPUT')return;
  if(e.key==='f'||e.key==='F'){e.preventDefault();toggleFS();}
  if(e.key==='Escape'&&document.body.classList.contains('present')&&!fsElement()){document.body.classList.remove('present');layout();}
});

/* clavier d'accents + compteur de mots */
const ACC=['é','è','ê','ë','à','â','î','ï','ô','û','ù','ç','œ','æ','|','É','È','À','Ç','|','« ',' »','’'];
const accBar=document.createElement('div');accBar.className='acc-bar';
const accCount=document.createElement('span');accCount.className='acc-count';
let curEd=null;
ACC.forEach(ch=>{
  if(ch==='|'){const s=document.createElement('span');s.className='acc-sep';accBar.appendChild(s);return;}
  const b=document.createElement('button');b.type='button';b.className='acc-key';b.textContent=ch.trim()||ch;
  b.addEventListener('mousedown',e=>e.preventDefault());
  b.addEventListener('click',()=>{
    if(!curEd)return;
    const p=curEd.querySelector?curEd.querySelector('.write-placeholder'):null;if(p)p.style.display='none';
    curEd.focus();
    if(curEd.tagName==='INPUT'||curEd.tagName==='TEXTAREA'){const s=curEd.selectionStart||0,e2=curEd.selectionEnd||0;curEd.value=curEd.value.slice(0,s)+ch+curEd.value.slice(e2);curEd.selectionStart=curEd.selectionEnd=s+ch.length;}
    else{document.execCommand('insertText',false,ch);}
    updCount();
  });
  accBar.appendChild(b);
});
accBar.appendChild(accCount);document.body.appendChild(accBar);
function edText(el){if(el.tagName==='INPUT'||el.tagName==='TEXTAREA')return el.value||'';const p=el.querySelector('.write-placeholder');let t=el.innerText||'';if(p&&p.offsetParent!==null&&p.innerText)t=t.split(p.innerText).join('');return t;}
function updCount(){
  if(!curEd)return;
  const m=edText(curEd).match(/[A-Za-zÀ-ÖØ-öø-ÿ0-9]+(?:['’-][A-Za-zÀ-ÖØ-öø-ÿ0-9]+)*/g);
  const n=m?m.length:0;
  const mn=parseInt(curEd.dataset.min||0),mx=parseInt(curEd.dataset.max||0);
  accCount.className='acc-count';
  if(mn&&mx){accCount.textContent=n+' / '+mn+'–'+mx+' mots';const st=(n===0?'':(n<mn?'under':(n>mx?'over':'ok')));if(st)accCount.classList.add(st);}
  else{accCount.textContent=n+(n>1?' mots':' mot');}
}
function edOf(t){return t&&t.closest?t.closest('[contenteditable],input[type=text],textarea'):null;}
document.addEventListener('focusin',e=>{const ed=edOf(e.target);if(ed){curEd=ed;accBar.classList.add('on');updCount();}});
document.addEventListener('focusout',()=>{setTimeout(()=>{if(!edOf(document.activeElement))accBar.classList.remove('on');},160);});
document.addEventListener('input',e=>{const ed=edOf(e.target);if(ed){curEd=ed;updCount();}});

render(0,false);layout();
</script>
<div class='pz-ctrl'><button class='pz-btn' id='pzMinus' title='Réduire'>−</button><span class='pz-lbl' id='pzLbl'>100%</span><button class='pz-btn' id='pzPlus' title='Agrandir'>+</button></div><script>(function(){var zr=document.getElementById('zr');function bump(d){if(!zr)return;var v=Math.min(parseInt(zr.max),Math.max(parseInt(zr.min),parseInt(zr.value)+d));zr.value=v;zr.dispatchEvent(new Event('input'));}var a=document.getElementById('zmMinus'),b=document.getElementById('zmPlus');if(a)a.onclick=function(){bump(-10)};if(b)b.onclick=function(){bump(10)};function inPres(){return document.body.classList.contains('present');}function pzApply(){window.pz=Math.min(2.5,Math.max(0.5,window.pz||1));var l=document.getElementById('pzLbl');if(l)l.textContent=Math.round((window.pz||1)*100)+'%';if(typeof layout==='function')layout();}var pm=document.getElementById('pzMinus'),pp=document.getElementById('pzPlus');if(pm)pm.onclick=function(){window.pz=(window.pz||1)-0.1;pzApply();};if(pp)pp.onclick=function(){window.pz=(window.pz||1)+0.1;pzApply();};document.addEventListener('keydown',function(e){if(!inPres())return;if(e.target.isContentEditable||e.target.tagName==='INPUT')return;if(e.key==='+'||e.key==='='){window.pz=(window.pz||1)+0.1;pzApply();}if(e.key==='-'||e.key==='_'){window.pz=(window.pz||1)-0.1;pzApply();}});var ab=document.querySelector('.acc-bar');if(ab){new MutationObserver(function(){document.body.classList.toggle('acc-open',ab.classList.contains('on'));}).observe(ab,{attributes:true,attributeFilter:['class']});}})();</script></body></html>
